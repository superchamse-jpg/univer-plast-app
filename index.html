<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--g1:#c6f6d5;--g2:#a5c8f8;--card:#fff;--tx:#1f2937;--mut:#6b7280;--br:#e2e5ea;--in:#f4f6f9;--pr:#3f3d8f;--prt:#fff;--dg:#b42318}

:root[data-theme="dark"]{--g1:#143028;--g2:#16284a;--card:#1d232b;--tx:#eceff3;--mut:#9aa4b2;--br:#2c333b;--in:#12171c;--pr:#a5b4fc;--prt:#10123a;--dg:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:linear-gradient(160deg,var(--g1),var(--g2)) fixed}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:8px;padding:12px 16px}
.ti{flex:1;text-align:center;font-weight:700;font-size:19px}
.logo{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:24px;border:3px solid var(--pr)}
header button{background:none;border:0;font-size:28px;color:var(--pr);width:46px;height:46px;padding:0}
main{padding:8px 14px 24px;max-width:640px;margin:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;direction:ltr}
.tile{direction:rtl;background:var(--card);border:0;border-radius:16px;padding:18px 8px;color:var(--tx);font-size:17px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.tile i{font-style:normal;font-size:46px;line-height:1}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--br);border-radius:10px;background:var(--in);color:var(--tx);font-size:16px;margin-bottom:8px;font-family:inherit}
button{font-family:inherit;font-size:15px;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 12px}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:700}
button.d{color:var(--dg)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.prod{text-align:right;display:flex;flex-direction:column;gap:2px}
.prod small,.mut{color:var(--mut);font-size:13px}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--br)}
.line .n{flex:1}
.tot{font-size:20px;font-weight:700;display:flex;justify-content:space-between;margin:8px 0}
.st{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--br)}
.red{color:var(--dg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:16px}
.dg{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.dg input{text-align:center;font-size:22px;background:var(--pr);color:var(--prt)}
html.flat{background:#f4f5f6}

main.sm{padding:0;max-width:none}
.sl{direction:ltr}
.tp{display:flex;padding-top:6px}
.tl{flex:0 0 65%}
.tt1{font-size:22px;font-weight:700;padding:6px 16px;direction:rtl;text-align:left}
.tb{background:#4b4a85;color:#fff;font-size:52px;font-weight:700;text-align:center;padding:6px 8px;line-height:1.15;overflow:hidden}
.tg{flex:1;padding-top:30px}
.sw{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:14px;margin:0 10px 26px}
.sw input{appearance:none;-webkit-appearance:none;width:52px;height:28px;border-radius:14px;background:#9ca3af;position:relative;margin:0;padding:0;border:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked{background:#4b4a85}
.sw input:checked::after{left:26px}
.ib{display:flex;gap:6px;align-items:center;padding:10px 8px;background:var(--card)}
.ib input{margin:0;flex:1;border:0;background:transparent;direction:rtl;min-width:0}
.ic{width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;border:0;background:var(--in)}
.pl{max-height:32vh;overflow-y:auto}
.pw{display:flex;align-items:center;padding:14px 10px;background:#f7e5e0;color:#1f2937;border-bottom:3px solid #fff;font-weight:700;font-size:17px}
.pw .a{flex:1}.pw .b{width:90px;text-align:center}.pw .c{width:110px;text-align:right}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#4b4a85;color:#fff;padding:10px 14px;margin-top:6px}
.hb{width:42px;height:42px;border-radius:50%;background:#fff;color:#4b4a85;border:0;padding:0;font-size:20px}
.cc{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px 0 150px}
.cd{background:#f1f2f3;color:#1f2937;text-align:center;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:16px}
.cd .pt{background:#e8380d;color:#fff;padding:2px 14px;font-size:20px;border-radius:0;margin:0}
.qy{background:#fde047;color:#111;font-size:22px;padding:0 4px}
.ft{position:fixed;left:0;right:0;bottom:0;display:flex;direction:ltr;background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.cn{position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:#4b4a85;color:#fff;padding:2px 12px;font-size:15px;white-space:nowrap;direction:rtl}
.cu{flex:1;display:flex;align-items:center;gap:6px;padding:0 12px;color:#2563eb;font-size:19px;min-width:0}
.cu select{margin:0;border:0;background:transparent;color:inherit;font-size:19px;padding:0;width:auto;flex:1;min-width:0}
.ok2{flex:1.4;background:#4b4a85;color:#fff;border:0;border-radius:0;font-size:20px;padding:26px 0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;z-index:99;max-width:90%;text-align:center;direction:rtl}

.fs-home{padding:8px 0 28px}.fs-hero{background:linear-gradient(135deg,#25245f,#4b4a85 60%,#4e9bba);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}.fs-hero h2{margin:0 0 6px;font-size:22px}.fs-hero p{margin:0;opacity:.9;font-size:14px}.fs-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.fs-metric{background:var(--card);padding:13px;border-radius:13px;box-shadow:0 1px 4px #0001}.fs-metric small{display:block;color:var(--mut);margin-bottom:6px}.fs-metric b{font-size:20px}.fs-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.fs-actions button{min-height:78px;font-size:16px;font-weight:700}.fs-actions button span{display:block;font-size:25px;margin-bottom:4px}.fs-stop{background:var(--card);padding:12px;border-radius:13px;margin:8px 0;border:1px solid var(--br)}.fs-stop.done{opacity:.7}.fs-stop-head{display:flex;gap:8px;align-items:center}.fs-stop-head .grow{flex:1;min-width:0}.fs-stop-head b{display:block;overflow-wrap:anywhere}.fs-chip{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--in);display:inline-block;margin-top:4px}.fs-mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.fs-mini button{flex:1;min-width:90px}.fs-note{width:100%;min-height:68px;border:1px solid var(--br);border-radius:10px;padding:10px;background:var(--in);color:var(--tx);font:inherit;margin-top:8px}.fs-empty{text-align:center;padding:20px;color:var(--mut)}

#receipt{display:none}
@media print{
html{background:#fff!important}
body>*:not(#receipt){display:none!important}
#receipt{display:block;color:#000;background:#fff;font-family:Tahoma,Arial,sans-serif;padding:2mm}
#receipt h2{text-align:center;margin:0 0 2px;font-size:16px}
#receipt .c{text-align:center}
#receipt table{width:100%;border-collapse:collapse}
#receipt td{padding:2px 0;vertical-align:top}
#receipt .e{text-align:left;white-space:nowrap}
#receipt hr{border:0;border-top:1px dashed #000;margin:4px 0}
#receipt .b{font-weight:700;font-size:14px}
.receipt-part{margin-bottom:12px;padding-bottom:12px;border-bottom:2px dashed #000}
.receipt-tag{text-align:center;font-weight:700;font-size:13px;background:#eee;padding:2px;margin:4px 0;border:1px solid #000}
}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>

<script>
var K='merchant_v3';
var S={shop:{name:'UNIVER PLAST',phone:'',width:'58',cur:'دج'},products:[],customers:[],suppliers:[],employees:[],invoices:[],purchases:[],expenses:[],seq:1};
try{var r=localStorage.getItem(K)||localStorage.getItem('merchant_v2')||localStorage.getItem('merchant_v1');if(r){var o=JSON.parse(r);for(var k in o)S[k]=o[k]}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){toast('تعذّر حفظ البيانات على هذا الجهاز.');return false}}

var SEED='ME110020|MANCHON égale DN20 PN16|95|70|6650;ME110025|MANCHON égale DN25 PN16|48|105|5040;ME110032|MANCHON égale DN32 PN16|65|150|9750;ME110040|MANCHON égale DN40 PN16|32|260|8320;ME110050|MANCHON égale DN50 PN16|40|420|16800;ME110063|MANCHON égale DN63 PN16|20|580|11600;ME110075|MANCHON égale DN75 PN16|16|920|14720;ME110090|MANCHON égale DN90 PN16|11|1220|13420;MR124025|MANCHON Reduit DN 40/25 PN16|50|215.55|10777.5;MR126340|MANCHON Reduit DN 63/40 PN16|18|435.5|7839;MR127550|MANCHON Reduit DN 75/50 PN16|9|837.5|7537.5;MR127563|MANCHON Reduit DN 75/63 PN16|18|875|15750;MR129063|MANCHON Reduit DN 90/63 PN16|13|1215.5|15801.5;MR129075|MANCHON Reduit DN 90/75 PN16|12|1235.5|14826;RM220020A|RACCORD Màle DN20*1/2" PN16|155|47|7285;RM220025B|RACCORD Màle DN25*3/4" PN16|80|75|6000;RM220032C|RACCORD Màle DN32*1" PN16|50|95|4750;RM220040D|RACCORD Màle DN40*1-1/4" PN16|60|180|10800;RM220050E|RACCORD Màle DN50*1-1/2" PN16|35|220|7700;RM220063F|RACCORD Màle DN63*2" PN16|18|345|6210;RM220063G|RACCORD Màle DN63*2 1/2" PN16|18|345|6210;RM220075G|RACCORD Màle DN75*2 1/2" PN16|12|545|6540;RM220075H|RACCORD Màle DN75*3" PN16|12|545|6540;RM220090H|RACCORD Màle DN90*3" PN16|16|785|12560;RF330020A|RACCORD Femelle DN20*1/2" PN16|155|65|10075;RF330025B|RACCORD Femelle DN25*3/4" PN16|80|75|6000;RF330032C|RACCORD Femelle DN32*1" PN16|50|115|5750;RF330040D|RACCORD Femelle DN40*1-1/4" PN16|50|180|9000;RF330050E|RACCORD Femelle DN50*1-1/2" PN16|34|285|9690;RF330063F|RACCORD Femelle DN63*2" PN16|18|395|7110;RF330075G|RACCORD Femelle DN75*2 1/2" PN16|13|637.8|8291.4;CE550020|COUDE égale DN20 PN16|85|72|6120;CE550025|COUDE égale DN25 PN16|45|115|5175;CE550032|COUDE égale DN32 PN16|27|165|4455;CE550040|COUDE égale DN40 PN16|30|265|7950;CE550050|COUDE égale DN50 PN16|15|415|6225;CE550063|COUDE égale DN63 PN16|18|595|10710;CE550075|COUDE égale DN75 PN16|12|975|11700;CM560020A|COUDE Màle DN20*1/2" PN16|150|51.2|7680;CM560025B|COUDE Màle DN25*3/4" PN16|80|78|6240;CM560032C|COUDE Màle DN32*1" PN16|44|109|4796;CM560040D|COUDE Màle DN40*1-1/4" PN16|50|192|9600;CF570020A|COUDE Femelle DN20*1/2" PN16|125|70|8750;CF570025B|COUDE Femelle DN25*3/4" PN16|75|108|8100;CF570032C|COUDE Femelle DN32*1" PN16|42|147|6174;CF570040D|COUDE Femelle DN40*1-1/4" PN16|48|245|11760;TE440020|Té égale DN20 PN16|55|115|6325;TE440025|Té égale DN25 PN16|28|178|4984;TE440032|Té égale DN32 PN16|18|235|4230;TE440040|Té égale DN40 PN16|20|395|7900;TE440050|Té égale DN50 PN16|20|595|11900;TE440063|Té égale DN63 PN16|12|875|10500;TE440075|Té égale DN75 PN16|7|1470|10290;BE660025|BOUCHON Ø25 PN16|100|75|7500;BE660040|BOUCHON Ø40 PN16|34|155|5270;BE660050|BOUCHON Ø50 PN16|18|235|4230;BE660063|BOUCHON Ø63 PN16|22|325|7150';
function seedP(){var n=0,u=0;SEED.split(';').forEach(function(l){var a=l.split('|'),p=S.products.filter(function(x){return x.k===a[0]})[0];if(p){p.n=a[1];p.bx=+a[2];p.p=+a[3];p.bc=+a[4];u++}else{S.products.push({id:uid(),k:a[0],n:a[1],bx:+a[2],p:+a[3],bc:+a[4],c:0,s:'',truck:0});n++}});S.seeded=1;save();return [n,u]}
if(!S.products.length&&!S.seeded)seedP();
if(!S.customers.length){S.customers=[{id:uid(),n:'مؤسسة السباكة الحديثة',debt:15000},{id:uid(),n:'محطة الأنابيب المتطورة',debt:8200}];save();}

var T=[['route','جولة الموزّع','🗺️'],['truck','مخزون الشاحنة','🚚'],['sale','بيع / طلبية','🛒'],['hist','المبيعات','📊'],['prods','المخزن','🏬'],['cus','الزبائن','🤝'],['exp','المصاريف','🧮'],['stat','الإحصاء','📈']];
var v='home',cart=[],q='',disc='',paid='',cid='',saleMode='direct';
if(!Array.isArray(S.truckMoves))S.truckMoves=[]; if(!Array.isArray(S.orders))S.orders=[]; S.products.forEach(function(p){if(p.truck==null)p.truck=0});

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f(n){return (Math.round(n*100)/100).toLocaleString('en-US')+' '+S.shop.cur}
function num(i){return parseFloat($(i).value)}
function dt(x){return new Date(x).toLocaleString('ar-DZ-u-nu-latn')}
function uid(){return Date.now()+Math.random()}
window.alert=function(m){toast(m)};
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},4000)}

function go(x){v=x;render();window.scrollTo(0,0)}
function render(){
 var fl=v==='sale'||v==='hist'||v==='inv'||v==='cus'||v==='cform'||v==='prods'||v==='truck'||v==='route';$('hd').style.display=fl?'none':'';document.documentElement.classList.toggle('flat',fl);$('app').className=fl?'sm':'';
 $('hd').innerHTML=(v==='home'?'<span class="logo">🧾</span>':'<button onclick="go(\'home\')">→</button>')+'<span class="ti">'+esc(S.shop.name)+'</span>';
 var V={home:homeV,route:routeV,truck:truckV,sale:saleV,hist:histV,prods:stkV,cus:cusV,exp:expV,stat:statV};
 $('app').innerHTML=V[v]?V[v]():homeV();
}

function homeV(){
 var today=new Date().toDateString(),vis=(S.routePlan||[]).filter(function(x){return x.day===today}),done=vis.filter(function(x){return x.status==='done'}).length;
 var sales=S.invoices.filter(function(x){return !x.visit&&new Date(x.d).toDateString()===today}).reduce(function(a,x){return a+x.t},0);
 var paid=S.invoices.filter(function(x){return !x.visit&&new Date(x.d).toDateString()===today}).reduce(function(a,x){return a+(x.paid||0)},0);
 var debt=S.customers.reduce(function(a,c){return a+(c.debt||0)},0);
 var h='<div class="fs-home"><div class="fs-hero"><h2>UNIVER PLAST | الموزّع الميداني</h2><p>'+esc(new Date().toLocaleDateString('ar-DZ'))+' · إدارة الجولة، المبيعات والتحصيل المباشر.</p><div style="margin-top:12px;font-size:14px">إنجاز الجولة اليومية: <b>'+done+' / '+vis.length+'</b></div></div>';
 h+='<div class="fs-metrics"><div class="fs-metric"><small>مبيعات اليوم</small><b>'+f(sales)+'</b></div><div class="fs-metric"><small>تحصيلات اليوم</small><b>'+f(paid)+'</b></div><div class="fs-metric"><small>إجمالي الديون</small><b class="red">'+f(debt)+'</b></div></div>';
 h+='<div class="fs-actions"><button onclick="go(\'route\')"><span>🗺️</span>جولة الموزّع</button><button onclick="go(\'truck\')"><span>🚚</span>مخزون الشاحنة</button><button onclick="go(\'sale\')"><span>🛒</span>بيع / طلبية جديدة</button><button onclick="go(\'cus\')"><span>💰</span>الزبائن والتحصيل</button></div>';
 h+='<div class="card"><b>مهمات الجولة اليومية</b><div class="st"><span>مخطط الزيارات اليوم</span><b>'+vis.length+'</b></div><div class="st"><span>زيارات منجزة</span><b>'+done+'</b></div><button class="p" style="width:100%;margin-top:10px" onclick="go(\'route\')">متابعة الجولة</button></div>';
 h+='</div>';return h;
}

function routeToday(){return new Date().toDateString()}
function routeList(){if(!Array.isArray(S.routePlan))S.routePlan=[];return S.routePlan.filter(function(x){return x.day===routeToday()})}
function routeAdd(i){var c=S.customers[i];if(!c)return;var L=routeList();if(L.some(function(x){return x.cid===c.id})){toast('الزبون موجود في الجولة');return}S.routePlan.push({id:uid(),cid:c.id,name:c.n,day:routeToday(),status:'todo',note:'',outcome:'',paidAmt:0,added:new Date().toISOString()});save();render()}
function routeRemove(id){S.routePlan=S.routePlan.filter(function(x){return x.id!==id});save();render()}
function routeMark(id,status){var x=S.routePlan.filter(function(a){return a.id===id})[0];if(!x)return;x.status=status;x.updated=new Date().toISOString();save();render()}
function routeSaveNote(id){
 var x=S.routePlan.filter(function(a){return a.id===id})[0];if(!x)return;
 x.note=$('rn_'+id).value.trim();
 x.outcome=$('ro_'+id).value;
 x.paidAmt=parseFloat($('ra_'+id).value)||0;
 x.comp=$('rc_'+id).value.trim();
 x.updated=new Date().toISOString();
 save();toast('حُفظ تقرير المحطة');render();
}

function routeV(){
 var L=routeList(),done=L.filter(function(x){return x.status==='done'}).length,added=S.customers.filter(function(c){return !L.some(function(x){return x.cid===c.id})});
 var h='<div class="card"><b>🗺️ تقرير جولة الموزّع اليومية</b><p class="mut">سجّل المبيعات، التحصيلات النقدية، وملاحظات السوق أثناء الزيارة.</p><div class="st"><span>إجمالي المحطات اليوم</span><b>'+L.length+'</b></div><div class="st"><span>الزيارات المنجزة</span><b>'+done+'</b></div><button class="p" style="width:100%;margin-top:10px" onclick="printRouteSummary()">🖨️ طباعة ملخص الجولة للإدارة</button></div>';
 if(L.length)h+=L.map(function(x,i){var c=S.customers.filter(function(a){return String(a.id)===String(x.cid)})[0];return '<div class="fs-stop '+(x.status==='done'?'done':'')+'"><div class="fs-stop-head"><div class="grow"><b>'+(i+1)+'. '+esc((c&&c.n)||x.name||'زبون')+'</b><span class="fs-chip">'+(x.status==='done'?'تمت الزيارة':x.status==='skip'?'تأجيل':'معلقة')+'</span></div></div>'
 +'<select id="ro_'+x.id+'" style="margin-top:8px"><option value=""'+(!x.outcome?' selected':'')+'>نتيجة الزيارة...</option><option '+(x.outcome==='order'?'selected':'')+' value="order">🛒 طلب / بيع مباشر</option><option '+(x.outcome==='paid'?'selected':'')+' value="paid">💰 تحصيل دين سابق</option><option '+(x.outcome==='both'?'selected':'')+' value="both">🛍️ بيع + تحصيل</option><option '+(x.outcome==='noorder'?'selected':'')+' value="noorder">❌ لم يطلب (المخزون كافٍ)</option><option '+(x.outcome==='closed'?'selected':'')+' value="closed">🔒 المحل مغلق</option><option '+(x.outcome==='followup'?'selected':'')+' value="followup">⏳ طلب متابعة لاحقاً</option></select>'
 +'<input id="ra_'+x.id+'" type="number" placeholder="المبلغ المحصل نقداً (إن وجد)" value="'+(x.paidAmt||'')+'">'
 +'<input id="rc_'+x.id+'" placeholder="حالة السوق / أسعار المنافسين" value="'+esc(x.comp||'')+'">'
 +'<textarea class="fs-note" id="rn_'+x.id+'" placeholder="ملاحظات الزيارة...">'+esc(x.note||'')+'</textarea>'
 +'<div class="fs-mini"><button class="p" onclick="routeSaveNote('+JSON.stringify(x.id)+')">حفظ التقرير</button><button onclick="routeMark('+JSON.stringify(x.id)+',\'done\')">✓ تمت الزيارة</button><button class="d" onclick="routeRemove('+JSON.stringify(x.id)+')">إزالة</button></div></div>'}).join('');else h+='<div class="card fs-empty">لم أضف زبائن للجولة اليوم. أضفهم أدناه.</div>';
 h+='<div class="card"><b>➕ إضافة زبون للجولة</b>'+added.slice(0,20).map(function(c){return '<div class="line"><span class="n"><b>'+esc(c.n)+'</b></span><button class="p" onclick="routeAdd('+S.customers.indexOf(c)+')">إضافة</button></div>'}).join('')+'</div>';
 return h;
}

function printRouteSummary(){
 var L=routeList(),sales=0,paidTot=0;
 S.invoices.forEach(function(x){if(new Date(x.d).toDateString()===routeToday()){sales+=x.t;paidTot+=x.paid||0}});
 var w=S.shop.width,A=w==='A4';
 $('pg').textContent='@page{size:'+(A?'A4':w+'mm auto')+';margin:0}@media print{#receipt{width:'+(A?'auto':w+'mm')+';font-size:12px}}';
 var h='<h2>'+esc(S.shop.name)+'</h2><div class="c">تقرير جولة الموزّع الميداني</div><div class="c">'+dt(new Date().toISOString())+'</div><hr>';
 h+='<table><tr><td>عدد المحطات</td><td class="e">'+L.length+'</td></tr><tr><td>الزيارات المنجزة</td><td class="e">'+L.filter(function(x){return x.status==='done'}).length+'</td></tr><tr><td>إجمالي مبيعات اليوم</td><td class="e">'+f(sales)+'</td></tr><tr><td>إجمالي التحصيلات</td><td class="e">'+f(paidTot)+'</td></tr></table><hr><b>تفاصيل المحطات:</b><table>';
 L.forEach(function(x,i){h+='<tr><td>'+(i+1)+'. '+esc(x.name)+'<br><small>'+(x.outcome||'بدون نتيجة')+' | محصل: '+f(x.paidAmt||0)+'</small></td></tr>'});
 h+='</table><hr><div class="c">توقيع الموزع / الإدارة</div>';
 $('receipt').innerHTML=h;
 setTimeout(function(){window.print()},100);
}

function payC(i){
 var c=S.customers[i];
 askF('تسديد دين من : '+c.n,[['المبلغ المسدد نقداً',c.debt||0]],function(r){
  var x=parseFloat(r[0]);if(!(x>0))return;
  var paidAmt=Math.min(x,c.debt||0);
  (S.payments=S.payments||[]).unshift({d:new Date().toISOString(),ci:c.id,n:c.n,a:paidAmt});
  c.debt=Math.max(0,(c.debt||0)-paidAmt);
  save();render();
  printReceipt(c.n, paidAmt, c.debt);
 });
}

function printReceipt(cusName, paidAmt, remDebt){
 var w=S.shop.width,A=w==='A4';
 $('pg').textContent='@page{size:'+(A?'A4':w+'mm auto')+';margin:0}@media print{#receipt{width:'+(A?'auto':w+'mm')+';font-size:12px}}';
 var parts = ['نسخة الزبون (المشتري)', 'نسخة الموزّع (السيارة)', 'نسخة الإدارة (المحاسبة)'];
 var fullHtml = '';
 parts.forEach(function(tag){
   fullHtml += '<div class="receipt-part">';
   fullHtml += '<div class="receipt-tag">--- ' + tag + ' ---</div>';
   fullHtml += '<h2>'+esc(S.shop.name)+'</h2><div class="c">وصل تسديد واستلام أموال</div><div class="c">'+dt(new Date().toISOString())+'</div><hr>';
   fullHtml += '<table><tr><td>وصلنا من السيد:</td><td class="e"><b>'+esc(cusName)+'</b></td></tr><tr><td>المبلغ المسدد:</td><td class="e"><b>'+f(paidAmt)+'</b></td></tr><tr class="b"><td>الدين المتبقي:</td><td class="e">'+f(remDebt)+'</td></tr></table><hr><div class="c">شكراً لتعاملكم - UNIVER PLAST</div>';
   fullHtml += '</div>';
 });
 $('receipt').innerHTML=fullHtml;
 setTimeout(function(){window.print()},100);
}

function truckV(){
 var total=0,rows='';
 S.products.forEach(function(p,i){if(p.truck==null)p.truck=0;var n=+p.truck||0;total+=n*(p.c||0);rows+='<div class="line"><span class="n"><b>'+esc(p.n)+'</b><br><small class="mut">المستودع: '+(p.s===''||p.s==null?'غير متابع':p.s)+' · الشاحنة: <b>'+(+p.truck||0)+'</b></small></span><button class="p" onclick="truckLoad('+i+')">تحميل</button></div>'});
 return '<div class="card"><b>🚚 مخزون الشاحنة</b><div class="st"><span>تكلفة بضاعة الشاحنة</span><b>'+f(total)+'</b></div></div><div class="card"><b>المنتجات</b>'+rows+'</div>';
}
function truckLoad(i){var p=S.products[i];askF('تحميل للشاحنة: '+p.n,[['الكمية',1]],function(r){var q=parseFloat(r[0]);if(!(q>0))return;if(p.s!==''&&p.s!=null)p.s-=q;p.truck=(+p.truck||0)+q;save();render()})}

function saleV(){
 var list=S.products.filter(function(p){return !q||(p.n+' '+(p.k||'')).toLowerCase().indexOf(q.toLowerCase())>-1});
 var h='<div class="sl"><div class="tp"><div class="tl"><div class="tt1">المبلغ الإجمالي</div><div class="tb">'+f(sub())+'</div></div></div>';
 h+='<div class="ib"><input id="q" placeholder="🔍 بحث عن منتج..." value="'+esc(q)+'" oninput="q=this.value;render()"><button class="ic" onclick="go(\'home\')">⌂</button></div>';
 h+='<div class="pl">'+(list.map(function(p,i){return '<div class="pw" onclick="addToCart('+i+')"><span class="a">'+esc(p.n)+'</span><span class="b">'+f(p.p)+'</span><span class="c">بالشاحنة: '+(+p.truck||0)+'</span></div>'}).join('')||'<p class="mut">لا توجد منتجات</p>')+'</div>';
 h+='<div class="cc">'+cart.map(function(l,i){return '<div class="cd"><b>'+esc(l.n)+'</b><span class="pt">'+f(l.p)+'</span><span class="qy">'+l.q+' قطعة</span></div>'}).join('')+'</div>';
 h+='<div class="ft"><label class="cu">👤<select onchange="cid=this.value"><option value="">اسم الزبون</option>'+S.customers.map(function(c,i){return '<option value="'+i+'"'+(String(i)===cid?' selected':'')+'>'+esc(c.n)+'</option>'}).join('')+'</select></label><button class="ok2" onclick="checkout(true)">تأكيد وطباعة الوصل</button></div></div>';
 return h;
}
function addToCart(i){var p=S.products[i],l=cart.filter(function(x){return x.id===p.id})[0];if(l)l.q++;else cart.push({id:p.id,n:p.n,p:p.p,q:1});render()}
function sub(){return cart.reduce(function(a,x){return a+(x.p*x.q)},0)}
function checkout(pr){
 if(!cart.length)return;
 for(var ci=0;ci<cart.length;ci++){var cl=cart[ci],cp=S.products.filter(function(x){return x.id===cl.id})[0];if(cp&&(+cp.truck||0)<cl.q){toast('مخزون الشاحنة غير كافٍ للمنتج: '+cl.n);return}}
 var t=sub(),cu=cid===''?null:S.customers[cid],pd=t;
 if(cu)cu.debt=Math.max(0,(cu.debt||0)+t-pd);
 cart.forEach(function(l){var p=S.products.filter(function(x){return x.id===l.id})[0];if(p)p.truck=Math.max(0,(+p.truck||0)-l.q)});
 var inv={no:S.seq++,d:new Date().toISOString(),c:cu?cu.n:'',items:cart.slice(),t:t,paid:pd};
 S.invoices.unshift(inv);save();cart=[];cid='';render();if(pr)printInv(inv);
}
function printInv(x){
 var w=S.shop.width,A=w==='A4';
 $('pg').textContent='@page{size:'+(A?'A4':w+'mm auto')+';margin:0}@media print{#receipt{width:'+(A?'auto':w+'mm')+';font-size:12px}}';
 var parts = ['نسخة الزبون (المشتري)', 'نسخة الموزّع (السيارة)', 'نسخة الإدارة (المحاسبة)'];
 var fullHtml = '';
 parts.forEach(function(tag){
   fullHtml += '<div class="receipt-part">';
   fullHtml += '<div class="receipt-tag">--- ' + tag + ' ---</div>';
   fullHtml += '<h2>'+esc(S.shop.name)+'</h2><div class="c">وصل بيع تسليم بضاعة</div><hr><div>وصل رقم: '+x.no+'</div><div>'+dt(x.d)+'</div>'+(x.c?'<div>الزبون: '+esc(x.c)+'</div>':'')+'<hr><table>';
   x.items.forEach(function(l){fullHtml+='<tr><td>'+esc(l.n)+'<br>'+l.q+' × '+f(l.p)+'</td><td class="e">'+f(l.q*l.p)+'</td></tr>'});
   fullHtml+='</table><hr><table><tr class="b"><td>الإجمالي</td><td class="e">'+f(x.t)+'</td></tr><tr><td>المدفوع</td><td class="e">'+f(x.paid)+'</td></tr></table><hr><div class="c">شكراً لزيارتكم - UNIVER PLAST</div>';
   fullHtml += '</div>';
 });
 $('receipt').innerHTML=fullHtml;
 setTimeout(function(){window.print()},100);
}

function askF(title,fields,cb){
 var ov=document.createElement('div');ov.className='ov';
 var h='<div class="dg"><h3>'+esc(title)+'</h3>';
 fields.forEach(function(f,i){h+='<label style="display:block;text-align:right;margin:6px 0 2px">'+esc(f[0])+'</label><input id="fld_'+i+'" type="number" value="'+esc(f[1])+'">';});
 h+='<div class="row" style="margin-top:14px"><button class="p" id="okBtn">موافق</button><button id="clBtn">إلغاء</button></div></div>';
 ov.innerHTML=h;document.body.appendChild(ov);
 var inp=$('fld_0');if(inp){inp.focus();inp.select()}
 ov.querySelector('#okBtn').onclick=function(){
  var res=fields.map(function(f,i){return $('fld_'+i).value});
  document.body.removeChild(ov);cb(res);
 };
 ov.querySelector('#clBtn').onclick=function(){document.body.removeChild(ov)};
}

function stkV(){return '<div class="card"><b>المخزن والمستودع</b>'+S.products.map(function(p){return '<div class="line"><span class="n">'+esc(p.n)+'<br><span class="mut">المستودع: '+(p.s||0)+' · الشاحنة: '+(p.truck||0)+'</span></span><b>'+f(p.p)+'</b></div>'}).join('')+'</div>'}
function cusV(){return '<div class="card"><b>الزبائن والتحصيل المباشر</b>'+S.customers.map(function(c,i){return '<div class="line"><span class="n"><b>'+esc(c.n)+'</b><br><span class="mut">الدين المتبقي: <b class="red">'+f(c.debt||0)+'</b></span></span>'+(c.debt>0?'<button class="p" onclick="payC('+i+')">تسديد وطباعة وصل</button>':'')+'</div>'}).join('')+'</div>'}
function expV(){return '<div class="card"><b>المصاريف اليومية</b><p class="mut">قريباً إدارة مصاريف الطريق.</p></div>'}
function statV(){return '<div class="card"><b>التقارير والإحصائيات</b><p class="mut">ملخص حركات اليوم.</p></div>'}
function histV(){return '<div class="card"><b>سجل المبيعات</b>'+S.invoices.map(function(x){return '<div class="line"><span class="n"><b>وصل #'+x.no+'</b><br><small>'+dt(x.d)+' - '+(x.c||'نقدي')+'</small></span><b>'+f(x.t)+'</b></div>'}).join('')+'</div>'}

render();
</script>
</body>
