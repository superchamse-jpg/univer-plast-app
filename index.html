<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b32">
<title>UNIVER PLAST | إدارة الموزعين</title>
<style>
:root{--green:#123b32;--green2:#1d5a49;--lime:#d8f36a;--bg:#f3f6f4;--card:#fff;--ink:#15231f;--muted:#65756f;--line:#dce5df;--red:#b42318;--orange:#a15c00;--blue:#175cd3;--shadow:0 8px 26px #183c2a0c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;font-weight:750}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink);outline-color:var(--green2)}
label{display:block;font-size:13px;font-weight:750;margin-bottom:6px;color:#34463f}
.app{max-width:1400px;margin:auto;min-height:100vh}
.top{background:linear-gradient(120deg,var(--green),#205c4b);color:white;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:15px;background:var(--lime);color:var(--green);display:grid;place-items:center;font-size:20px;font-weight:1000}
.brand h1{font-size:20px;margin:0}
.brand p{margin:3px 0 0;color:#d1e6dc;font-size:12px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-light{background:#ffffff17;color:white;border:1px solid #ffffff35}
.btn-main{background:var(--green);color:#fff}
.btn-lime{background:var(--lime);color:var(--green)}
.btn-soft{background:#eaf2ed;color:var(--green)}
.btn-danger{background:#fff0ef;color:var(--red)}
.layout{display:grid;grid-template-columns:220px 1fr;gap:18px;padding:18px}
.side{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;height:max-content;position:sticky;top:12px}
.nav{width:100%;text-align:right;background:transparent;color:#43564e;margin:3px 0;padding:12px;display:flex;gap:10px;align-items:center}
.nav.active,.nav:hover{background:#eaf3ed;color:var(--green)}
.nav span:first-child{width:24px;text-align:center}
.side-note{margin:12px 5px 3px;border-top:1px solid var(--line);padding:13px 7px;color:var(--muted);font-size:12px;line-height:1.8}
.main{min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 15px}
.page-head h2{margin:0;font-size:24px}
.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stat .label{color:var(--muted);font-size:12px}
.stat .value{font-size:24px;font-weight:900;margin-top:8px;overflow-wrap:anywhere}
.stat .hint{font-size:12px;color:var(--muted);margin-top:5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:15px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 13px;font-size:17px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:180px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:720px;background:white}
th,td{text-align:right;padding:12px;border-bottom:1px solid #edf1ee;font-size:13px;vertical-align:middle}
th{background:#f7faf8;color:#52645c;font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:30px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800;background:#eaf2ed;color:var(--green)}
.badge.red{background:#fff0ef;color:var(--red)}
.badge.orange{background:#fff4dc;color:var(--orange)}
.badge.blue{background:#edf4ff;color:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{margin-bottom:12px}
.field small{color:var(--muted)}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.notice{border:1px solid #dce7b0;background:#f8fbe9;border-radius:12px;padding:12px;color:#475322;font-size:13px;line-height:1.7;margin-bottom:14px}
.hidden{display:none!important}
.products-lines{display:flex;flex-direction:column;gap:8px}
.product-line{display:grid;grid-template-columns:2fr .7fr .9fr auto;gap:8px;align-items:end;border:1px solid var(--line);padding:10px;border-radius:12px}
.product-line .remove{background:#fff0ef;color:var(--red);padding:9px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.summary>div{background:#f6f9f7;padding:12px;border-radius:12px}
.summary strong{display:block;font-size:18px;margin-top:5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.tabs button{background:#edf2ee;color:#40564b}
.tabs button.active{background:var(--green);color:#fff}
.muted{color:var(--muted)}
.small{font-size:12px}
.danger-text{color:var(--red)}
.foot{text-align:center;color:var(--muted);font-size:11px;padding:8px 18px 20px}
.modal-backdrop{position:fixed;inset:0;background:#10241dcc;z-index:20;display:grid;place-items:center;padding:12px}
.modal{width:min(760px,100%);max-height:94vh;overflow:auto;background:white;border-radius:18px;padding:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h3{margin:0}
.receipt{font-family:Tahoma,Arial,sans-serif;color:#111;background:#fff;padding:14px;border:1px dashed #aaa;margin:10px 0;page-break-inside:avoid}
.receipt-head{display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid #123b32;padding-bottom:8px;margin-bottom:8px}
.receipt h3{margin:0}
.receipt table{min-width:0}
.receipt th,.receipt td{padding:6px;font-size:11px}
.receipt .r-total{font-size:13px;font-weight:bold}
.copy-label{background:#e8eee9;text-align:center;font-weight:bold;padding:6px;margin:-14px -14px 12px}
.receipt-meta{font-size:11px;line-height:1.8}
.mobile-bottom{display:none}
@media(max-width:900px){
.layout{grid-template-columns:1fr;padding:12px}
.side{position:static;display:flex;overflow:auto;gap:3px;padding:7px}
.nav{min-width:max-content;width:auto;margin:0;padding:10px}
.nav span:last-child{font-size:12px}
.side-note{display:none}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
.page-head h2{font-size:21px}
}
@media(max-width:560px){
.top{padding:14px}
.brand h1{font-size:17px}
.top-actions button{padding:9px 10px;font-size:12px}
.layout{padding:10px}
.panel{padding:12px}
.stats{gap:8px}
.stat{padding:12px}
.stat .value{font-size:19px}
.grid2,.grid3{grid-template-columns:1fr}
.product-line{grid-template-columns:1fr 1fr}
.product-line .item-name{grid-column:1/-1}
.summary{grid-template-columns:1fr}
.page-head{align-items:flex-start}
.side{border-radius:13px}
.nav{padding:9px}
.nav span:first-child{width:auto}
}
@media print{
body{background:#fff}
.top,.side,.page-head,.stats,.no-print,.foot,.layout>.side{display:none!important}
.layout{display:block;padding:0}
.panel{border:0;box-shadow:none;padding:0}
.main{width:100%}
.receipt{border:1px solid #999;margin:0 0 12px;break-after:page}
.receipt:last-child{break-after:auto}
.receipt table{width:100%}
.receipt th,.receipt td{color:#111!important}
.modal-backdrop{position:static;display:block;background:#fff;padding:0}
.modal{width:100%;max-height:none;overflow:visible;padding:0}
.modal-head{display:none}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">UP</div><div><h1>UNIVER PLAST</h1><p>نظام تسيير المبيعات والموزعين والمخزون</p></div></div>
  <div class="top-actions">
    <button class="btn-light" onclick="exportData()">⬇ تصدير نسخة احتياطية</button>
    <button class="btn-light" onclick="document.getElementById('importFile').click()">⬆ استرجاع نسخة</button>
    <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)">
    <button class="btn-lime" onclick="openSale()">＋ فاتورة جديدة</button>
  </div>
</header>
<div class="layout">
<aside class="side">
<button class="nav active" data-page="dashboard" onclick="showPage('dashboard',this)"><span>▦</span><span>لوحة القيادة</span></button>
<button class="nav" data-page="sales" onclick="showPage('sales',this)"><span>🧾</span><span>المبيعات والفواتير</span></button>
<button class="nav" data-page="customers" onclick="showPage('customers',this)"><span>👥</span><span>الزبائن والموزعون</span></button>
<button class="nav" data-page="products" onclick="showPage('products',this)"><span>📦</span><span>السلع والمخزون</span></button>
<button class="nav" data-page="payments" onclick="showPage('payments',this)"><span>💳</span><span>الدفعات والديون</span></button>
<button class="nav" data-page="reports" onclick="showPage('reports',this)"><span>📊</span><span>التقارير</span></button>
<button class="nav" data-page="settings" onclick="showPage('settings',this)"><span>⚙</span><span>إعدادات الشركة</span></button>
<div class="side-note">بيانات هذا الإصدار تحفظ محليًا على نفس الجهاز والمتصفح. صدّر نسخة احتياطية بانتظام.</div>
</aside>
<main class="main">
